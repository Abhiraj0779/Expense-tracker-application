
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | Expense Tracker'">Expense | Expense Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <a class="brand" th:href="@{/expenses}">
        <span class="brand-mark small">₹</span>
        <span>
            Expense Tracker
            <small>PERSONAL FINANCE</small>
        </span>
    </a>
    <nav>
        <a th:href="@{/expenses}">Dashboard</a>
    </nav>
    <a class="button ghost small-button" th:href="@{/expenses}">
        ← Back to dashboard
    </a>
</header>

<main class="container narrow-container">

    <section class="page-heading compact-heading">
        <div>
            <p class="eyebrow">PERSONAL FINANCE</p>
            <h1 th:text="${pageTitle}">Add Expense</h1>
            <p class="muted">Enter the details of your transaction.</p>
        </div>
    </section>

    <div class="panel form-panel">

        <form th:action="${expense.id == null} ? @{/expenses} : @{/expenses/{id}(id=${expense.id})}"
              th:object="${expense}"
              method="post"
              class="stack-form">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <input type="hidden" th:field="*{id}">

            <div class="form-grid">

                <label class="span-2">
                    Expense description
                    <input type="text"
                           th:field="*{description}"
                           placeholder="e.g. Monthly groceries"
                           maxlength="120"
                           required>
                    <small class="field-error"
                           th:errors="*{description}"></small>
                </label>

                <label>
                    Category
                    <select th:field="*{category}" required>
                        <option value="">Choose category</option>
                        <option value="Food">Food & Groceries</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Housing">Housing & Rent</option>
                        <option value="Utilities">Utilities & Bills</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Education">Education</option>
                        <option value="Travel">Travel</option>
                        <option value="Other">Other</option>
                    </select>
                    <small class="field-error"
                           th:errors="*{category}"></small>
                </label>

                <label>
                    Amount (INR ₹)
                    <input type="number"
                           th:field="*{amount}"
                           placeholder="e.g. 500.00"
                           min="0.01"
                           step="0.01"
                           required>
                    <small class="field-error"
                           th:errors="*{amount}"></small>
                </label>

                <label class="span-2">
                    Expense date
                    <input type="date"
                           th:field="*{expenseDate}"
                           required>
                    <small class="field-error"
                           th:errors="*{expenseDate}"></small>
                </label>

            </div>

            <div class="form-actions">
                <a class="button ghost" th:href="@{/expenses}">
                    Cancel
                </a>
                <button class="button primary" type="submit">
                    Save expense →
                </button>
            </div>

        </form>

    </div>

    <footer class="footer">
        <span>Expense Tracker</span>
        <span>Your transaction will be saved to the database.</span>
    </footer>

</main>
</body>
</html>
